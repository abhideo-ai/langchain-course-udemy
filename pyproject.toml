[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhisheik Deo", email = "abhisheik@abhideo.ai" }
]
requires-python = ">=3.10"
dependencies = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.1",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
